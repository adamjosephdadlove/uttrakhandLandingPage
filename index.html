<html>
<head>

<header class="nav-cont-flexbox"> 
    <h1> Uttrakhand </h1>
    <a href="#Checkout"> Checkout </a>
    <a href="#Home"> Home </a>
</header>
<div id="#Home">
<section id="carousel-flexbox">
    <button id="previous" onclick="previousImg()"><</button>
    <div id="carousel-window">
<div id="carousel">
    <img src="https://images.unsplash.com/photo-1601821139990-9fc929db79ce?q=80&w=2070&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D">
    <img src="https://images.unsplash.com/photo-1547378809-db8f9515a63b?q=80&w=1170&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D">
    <img src="https://plus.unsplash.com/premium_photo-1676231364205-a75f7e588975?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1yZWxhdGVkfDh8fHxlbnwwfHx8fHw%3D">
    <img src="https://images.unsplash.com/photo-1669657039619-df0cab0f1de5?q=80&w=1170&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D">
    <img src="https://images.unsplash.com/photo-1585773668502-bf18672c14ac?q=80&w=530&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D">
</div>
 </div>
 <button id="next" onclick="nextImg()">></button>
</section>
 <p class="description">  </p>

 <div id="Checkout"> 
      <h1 class="checkout-title"> Checkout </h1> 
      <input type="text" required placeholder="Full Name" id="name"> 
      <input type="email" required placeholder="Email" id="email">
      <input type="text"  required placeholder="Username" id="username">  
      <input type="password"  required placeholder=" Password" id="password">
      <input type="password"  required placeholder="Confirm Password" id="confirmPassword">
     <button class="submit-button" onclick="validate()"> Submit </button>
 </div>
<script>
let index = 0;
let total = 5;
let changingText=['Bustling Town', 'Green Valleys', 'Rocky Mountains', 'Quiet Forest', 'Vast Plains'];

function validate() {
const checkPassword=document.getElementById("password").value;
const checkConfirmPassword=document.getElementById("confirmPassword").value;
const name=document.querySelector("#name").value;
const email=document.querySelector("#email").value;
const password=document.querySelector("#password").value;
const confirmPasscode=document.querySelector("#confirmPassword").value;
const username=document.querySelector("#username").value;
 if(name===''||password===''||email===''||confirmPasscode===''||username==='') {
       return alert("COMPLETE FORM!!!");
  }

  else {
    alert("Nice Job!");
  }
  
 if(checkPassword===checkConfirmPassword) {
    alert("You're password aligns our needs");
 }

 else {
   alert(`${checkPassword} and ${checkConfirmPassword} do not match`);
 }
}

function nextImg() {
    index = index+1;
    if (index === total) index = 0;
    updateCarousel()
}

function previousImg() {
    index = index - 1;
    if (index < 0) index = total-1;
    updateCarousel()
}

function updateCarousel() {
    document.getElementById("carousel").style.transform = `translateX(-${index * 300}px)`;

    document.querySelector(".description").innerHTML = changingText[index];
}

setInterval(nextImg, 3000);
</script>
</body>
</html>
